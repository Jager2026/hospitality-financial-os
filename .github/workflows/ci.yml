name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-typecheck-test-build:
    runs-on: ubuntu-latest

    env:
      # Present for every step, not just Test — Prisma's own `generate` and `validate` commands
      # both require DATABASE_URL to be a resolvable string even when they never open a real
      # connection to it (confirmed directly earlier in this project: `prisma validate` with no
      # DATABASE_URL fails with "Environment variable not found: DATABASE_URL", not a soft skip).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hospitality_os_test
      REDIS_URL: redis://localhost:6379
      # Sprint 3: env.validation.ts requires these to be non-empty strings so the app can start —
      # nothing in the test suite makes a real Stripe network call (StripeService is faked in
      # every test that touches it), so these never need to be working credentials, only present.
      STRIPE_SECRET_KEY: sk_test_ci_placeholder_not_a_real_key
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder_not_a_real_secret

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hospitality_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # No `version:` here, deliberately: pnpm/action-setup@v4 reads the version from
      # package.json's "packageManager" field on its own. Specifying both made every CI run
      # since the first commit fail immediately with "Multiple versions of pnpm specified" —
      # confirmed from the actual failed-run log, not assumed.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # @prisma/client's own postinstall hook cannot find schema.prisma automatically (it lives
      # at apps/backend/prisma/schema.prisma, not a default root location — the same
      # "could not find your Prisma schema in the default locations" warning showed up the very
      # first time this repo's dependencies were installed, confirming this isn't automatic).
      # Everything after this step — typecheck, test, build — imports generated types from
      # @prisma/client and fails without this running first.
      - name: Generate Prisma Client
        run: pnpm run prisma:generate

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format

      - name: Validate Prisma schema
        run: pnpm run prisma:validate

      # The Postgres service container above starts empty every run — nothing had applied the
      # migrations to it before now, because nothing in the test suite touched a real table.
      # ledger-trigger.integration.spec.ts changes that: it exercises the deferred trigger in
      # apps/backend/prisma/sql/ledger_integrity.sql directly, which only exists once these run.
      - name: Apply database migrations
        run: pnpm run prisma:migrate:deploy

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build
