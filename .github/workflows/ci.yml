name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-typecheck-test-build:
    runs-on: ubuntu-latest

    env:
      # Present for every step, not just Test — Prisma's own `generate` and `validate` commands
      # both require DATABASE_URL to be a resolvable string even when they never open a real
      # connection to it (confirmed directly earlier in this project: `prisma validate` with no
      # DATABASE_URL fails with "Environment variable not found: DATABASE_URL", not a soft skip).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hospitality_os_test
      REDIS_URL: redis://localhost:6379
      # Sprint 12: env.validation.ts requires each at least 32 characters so the app can start —
      # no test in the suite makes real use of these as signing secrets in a way that needs to be
      # unguessable (TokenService is faked or exercised only through real login/register flows
      # that mint and verify their own tokens within the same run), so a fixed placeholder is
      # fine, same "present so the app can start" reasoning as the Stripe placeholders below.
      # Needed starting with critical-flow.e2e.spec.ts / smoke.e2e.spec.ts (Sprint 12): the first
      # tests in this codebase to import AppModule itself rather than construct services by hand,
      # so the first to actually trigger ConfigModule's own validateEnv at boot.
      JWT_ACCESS_SECRET: ci_placeholder_access_secret_not_a_real_secret_32chars
      JWT_REFRESH_SECRET: ci_placeholder_refresh_secret_not_a_real_secret_32chars
      # Sprint 3: env.validation.ts requires these to be non-empty strings so the app can start —
      # nothing in the test suite makes a real Stripe network call (StripeService is faked in
      # every test that touches it), so these never need to be working credentials, only present.
      # ADR-038: STRIPE_SECRET_KEY and STRIPE_WEBHOOK_SECRET are deliberately NOT set here. They
      # are generated at runtime by the "Compose Stripe CI placeholders" step below — see that
      # step for why a literal cannot live in this file.
      # Sprint 5, ADR-021: required, no .default() in env.validation.ts (a fee rate is a business
      # decision, never silently assumed at boot) — CI needs a real value present for the app to
      # start at all, same reasoning as the Stripe placeholders above. The actual rate (100 = 1.00%)
      # doesn't matter for CI correctness; platform-fee.util.spec.ts tests the arithmetic directly.
      DEFAULT_PLATFORM_FEE_BASIS_POINTS: "100"
      # Sprint 11: required, no .default() in env.validation.ts (which Origins may call this API in
      # production is a business decision, never silently assumed) — same "present so the app can
      # start" reasoning as the vars above, in case a future CI step ever boots the real app.
      CORS_ORIGIN: http://localhost:3000
      # The frontend's build guard (`apps/frontend/scripts/check-public-env.mjs`) now runs on every
      # build rather than only when it believes it is in production. It believed that by reading
      # NODE_ENV, which this workflow never set — so on every pull request the guard exited 0
      # without checking anything, and the guard written in response to a production outage had
      # never run outside Railway.
      #
      # The real production URL rather than a placeholder, deliberately: it is public (it is the
      # API's own address), it is what Railway builds with, and it makes CI's bundle equivalent to
      # production's in the one respect this guard is about. A made-up non-loopback value would
      # satisfy the guard while proving less.
      NEXT_PUBLIC_API_URL: https://api.plaintabs.com

    services:
      postgres:
        # ADR-034: same major as production (Railway, 18.x) and as docker/docker-compose.yml.
        # CI is where migrations are actually proven to apply — proving that against a different
        # major than production runs is proving the wrong thing. Keep these three in lockstep.
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hospitality_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # ADR-056: the document-version invariant compares this branch against origin/main, which
      # needs real history. The default shallow clone (fetch-depth 1) has none, and the invariant
      # is written to FAIL rather than skip when it cannot resolve the merge base — so this line
      # is load-bearing, not a convenience.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ADR-038, and a genuine tension this resolves rather than papers over. env.validation.ts now
      # requires the Stripe secrets to have production's real shape (prefix, alphanumeric body,
      # length floor), and the right response to that was to make CI match production rather than
      # weaken the rule. But a placeholder realistic enough to satisfy our own validation is, by
      # construction, realistic enough to trip GitHub's secret scanner — pushing one was blocked as
      # a "Stripe Test API Secret Key", correctly. Clicking the unblock link would have worked and
      # would have been the wrong lesson: nobody should be training themselves to wave through
      # secret-scanning warnings.
      #
      # Generating the values here resolves both constraints at once and is strictly better than a
      # literal either way: nothing key-shaped exists in the repository to be scanned, leaked, or
      # mistaken for real, and a fresh random value each run cannot quietly become a real credential
      # someone pasted "just for now". These never reach Stripe — no test in this suite makes a live
      # network call, and the boot-time credential probe is production-only.
      - name: Compose Stripe and Resend CI placeholders
        run: |
          RAND_KEY=$(head -c 400 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 99)
          RAND_WHSEC=$(head -c 200 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 32)
          # Masked purely for log hygiene, not because these are sensitive — Actions echoes the
          # whole env block in every step header, and a 107-character key-shaped string scrolling
          # past on each step is exactly the kind of noise that makes a real leak harder to spot.
          echo "::add-mask::sk_test_${RAND_KEY}"
          echo "::add-mask::whsec_${RAND_WHSEC}"
          echo "STRIPE_SECRET_KEY=sk_test_${RAND_KEY}" >> "$GITHUB_ENV"
          echo "STRIPE_WEBHOOK_SECRET=whsec_${RAND_WHSEC}" >> "$GITHUB_ENV"
          # ADR-069: same reasoning, for Resend. The underscore in the middle is not decoration —
          # it mirrors the real key shape (re_<id>_<secret>), so this placeholder exercises the
          # actual regex rather than a simplified one that would pass a rule real keys fail.
          RAND_RESEND_ID=$(head -c 100 /dev/urandom | base64 | tr -dc "A-Za-z0-9" | head -c 8)
          RAND_RESEND_SECRET=$(head -c 200 /dev/urandom | base64 | tr -dc "A-Za-z0-9" | head -c 24)
          echo "::add-mask::re_${RAND_RESEND_ID}_${RAND_RESEND_SECRET}"
          echo "RESEND_API_KEY=re_${RAND_RESEND_ID}_${RAND_RESEND_SECRET}" >> "$GITHUB_ENV"

      # No `version:` here, deliberately: pnpm/action-setup@v4 reads the version from
      # package.json's "packageManager" field on its own. Specifying both made every CI run
      # since the first commit fail immediately with "Multiple versions of pnpm specified" —
      # confirmed from the actual failed-run log, not assumed.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # @prisma/client's own postinstall hook cannot find schema.prisma automatically (it lives
      # at apps/backend/prisma/schema.prisma, not a default root location — the same
      # "could not find your Prisma schema in the default locations" warning showed up the very
      # first time this repo's dependencies were installed, confirming this isn't automatic).
      # Everything after this step — typecheck, test, build — imports generated types from
      # @prisma/client and fails without this running first.
      - name: Generate Prisma Client
        run: pnpm run prisma:generate

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format

      # ADR-060: docs/INDEX.md no longer carries a version of its own — that single line was
      # the site of five consecutive merge conflicts with no content in any of them. What it stood
      # for (the register agrees with the documents) is checked here instead, both directions.
      - name: Documentation index integrity
        run: node .github/scripts/check-doc-index.js

      - name: Validate Prisma schema
        run: pnpm run prisma:validate

      # The Postgres service container above starts empty every run — nothing had applied the
      # migrations to it before now, because nothing in the test suite touched a real table.
      # ledger-trigger.integration.spec.ts changes that: it exercises the deferred trigger in
      # apps/backend/prisma/sql/ledger_integrity.sql directly, which only exists once these run.
      - name: Apply database migrations
        run: pnpm run prisma:migrate:deploy

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      # THREAT_MODEL.md, "No automated, recurring check for known-vulnerable dependencies"
      # (OWASP A03:2025) — closes it. High/critical severity fails the build; moderate/low stay
      # visible in the step's own output without blocking every PR (many have no available fix
      # yet or aren't exploitable in this app's actual usage — a gate that blocks on those trains
      # everyone to ignore it). Runs through check-audit.js rather than a bare `pnpm audit
      # --audit-level=high` — the pnpm version this project is pinned to (9.12.0) has no working
      # way to ignore a specific advisory (`audit.ignore`/`--ignore` need pnpm 10.11+, confirmed
      # directly, not assumed), and this project isn't bumping pnpm itself just to unblock this
      # gate (pnpm's own version drives Railway's package-manager detection, ADR-031). See that
      # script's own comment for exactly which advisories are explicitly ignored and why — a new
      # high/critical finding anywhere else still fails this step.
      #
      # LAST, DELIBERATELY, and the reason is visibility rather than importance (Founder decision,
      # 2026-09-04). Every step here runs in one job, so a failure at step four leaves Typecheck,
      # Test and Build reported as `skipped` — and this step depends on a third party we do not
      # control. On 2026-09-03/04 the endpoint `pnpm audit` posts to was intermittently dead for
      # hours (measured: ERR_SOCKET_TIMEOUT after 252s, while a plain registry GET answered in
      # 0.9s and the neighbouring advisories/bulk endpoint answered 200 in 10.8s), and every
      # occurrence hid whether our own code was green.
      #
      # WHAT THIS DOES AND DOES NOT FIX, stated so nobody expects the wrong thing: it fixes
      # VISIBILITY, not passability. A dead endpoint still fails this step and still blocks the
      # merge — the gate fails closed on purpose, because an audit that could not run is not an
      # audit that found nothing. What changes is that the other seven checks have already
      # reported by then, so "is our code green?" stops depending on a third party being up.
      #
      # The mirror cost, and why it is accepted: a broken build now hides the audit result. That
      # is the better direction to fail — a broken build is ours and must be fixed anyway, while
      # a registry outage is not ours and cannot be.
      - name: Dependency vulnerability scan
        run: node .github/scripts/check-audit.js
