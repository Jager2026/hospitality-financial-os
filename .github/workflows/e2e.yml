name: E2E

on:
  # NO `paths:` FILTER HERE, AND IT IS NOT AN OVERSIGHT — DO NOT ADD ONE BACK (ADR-073, option A').
  #
  # A workflow-level `paths:` filter that does not match produces NO WORKFLOW RUN AT ALL — measured,
  # `total_count: 0` — so `browser-e2e` was absent from a backend pull request rather than skipped.
  # Absent is indistinguishable from green to a reader, and it is worse than that to branch
  # protection: a required check that never reports blocks the merge PERMANENTLY, with every check
  # on the page still green. That was measured on a throwaway protected branch, not read.
  #
  # A job skipped by a job-level `if:` inside a workflow that DID trigger still reports a
  # conclusion. That is the entire difference, and it is what makes this check requirable.
  #
  # The condition did not disappear — ADR-041's reasoning stands and is restated on `decide` below.
  # It moved from the trigger, where its silence was invisible, into a job, where it is a visible
  # line somebody edits on purpose.
  pull_request:

jobs:
  # ADR-041, unchanged in substance: the browser suite runs only for changes that could affect it.
  # A slow check that runs on everything starts getting worked around, and a bypassed check is
  # worse than an absent one.
  #
  # The trigger for widening this is still named rather than left as "when it gets big": when the
  # frontend consumes enough of the API that a contract change would go unnoticed until a screen
  # breaks. Add `apps/backend/` to PATHS on that day, not before.
  decide:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The decision is a diff against the base, so the history has to be there.
          fetch-depth: 0

      - name: Decide whether the browser suite applies to this change
        id: check
        run: |
          set -uo pipefail
          PATHS="apps/frontend/ apps/e2e/ packages/ .github/workflows/e2e.yml"

          # FAILING CLOSED IS THE POINT. If the diff cannot be computed — a missing base ref, a
          # shallow fetch, a force-push mid-run — the answer is RUN, never skip. A decision step
          # that cannot decide must not be the reason a check went quiet; that is the class this
          # whole change exists to close.
          if ! CHANGED=$(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" 2>/dev/null) \
            || [ -z "${CHANGED}" ]; then
            echo "Could not compute the changed files against origin/${GITHUB_BASE_REF}."
            echo "Running the browser suite rather than guessing."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          echo "${CHANGED}"

          for prefix in ${PATHS}; do
            if echo "${CHANGED}" | grep -q "^${prefix}"; then
              echo "Matched ${prefix} — the browser suite applies."
              echo "run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "No change under: ${PATHS}"
          echo "The browser suite does not apply; browser-e2e will report skipped."
          echo "run=false" >> "$GITHUB_OUTPUT"

  browser-e2e:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      # A database of its own, created by the harness's own prepare step. Separate from the unit
      # suite's `hospitality_os_test` so the two cannot interfere.
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hospitality_os_e2e
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hospitality_os_e2e
      REDIS_URL: redis://localhost:6379

    services:
      postgres:
        # ADR-034: same major as production (Railway, 18.x), docker/docker-compose.yml and ci.yml.
        # Keep all four in lockstep — proving migrations against a different major than production
        # runs is proving the wrong thing.
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        # Real Redis, not a stub: /health reports it separately and the harness asserts it is up,
        # so "the suite is green" must not be satisfiable while Redis is down.
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter backend run prisma:generate

      # Both servers under test are the real production builds, started by Playwright's own
      # webServer from the real `start` scripts — not `dev`. A harness that only ever exercises the
      # development server proves the development server works.
      #
      # That build happens inside `test:e2e` below, via `apps/e2e/scripts/build-apps.mjs`, and NOT
      # as a step here. This workflow used to carry its own "Build backend" / "Build frontend"
      # steps, and they were **redundant and wrong at the same time**: `build:apps` rebuilt both
      # apps moments later, so their output was always discarded — which is the only reason nobody
      # noticed the frontend bundle they produced had no `NEXT_PUBLIC_API_URL` and therefore
      # pointed at `localhost:3001` instead of the harness's backend on 3101.
      #
      # Found by ADR-050's build guard, which now runs on every build instead of only when it
      # believes it is in production, and refused the step outright. A duplicated build that is
      # thrown away is not free: it is a second place that has to agree about ports and
      # environment, and it silently did not.
      - name: Install Playwright browser
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: Run browser end-to-end suite
        run: pnpm --filter e2e run test:e2e

      # Traces are retained only on failure (playwright.config.ts), so this uploads nothing on a
      # green run and everything needed to reconstruct a red one.
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/e2e/test-results/
          retention-days: 7
